name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  EXTENSION_KEY: fourallportal_typo3_extension

jobs:
  build:
    name: Build, SBOM & attest
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      # upload release assets
      contents: write
      # sign attestations via Sigstore
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # archive name comes from composer.json, SBOM name from the tag; both must agree
      - name: Resolve version
        run: |
          version=$(jq -r .version composer.json)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match composer.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build TER archive
        run: Build/Scripts/create-ter-archive.sh "$TAG"

      # the SBOM records the runtime dependency set resolved in composer.lock that
      # this release was tested against; the archive itself ships no dependencies
      # and consumers resolve their own versions within the composer.json constraints
      - name: Generate SBOM (CycloneDX)
        run: |
          composer global config --no-interaction allow-plugins.cyclonedx/cyclonedx-php-composer true
          composer global require --no-interaction --no-progress cyclonedx/cyclonedx-php-composer:6.2.0
          composer CycloneDX:make-sbom --omit=dev --output-format=JSON --spec-version=1.6 \
            --validate --mc-version="$VERSION" \
            --output-file="Build/dist/${EXTENSION_KEY}_${VERSION}.cdx.json"

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: Build/dist/*.zip

      - name: Attest SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: Build/dist/*.zip
          sbom-path: Build/dist/${{ env.EXTENSION_KEY }}_${{ env.VERSION }}.cdx.json

      # attach the Sigstore bundles too, so the signatures are visible on the release
      # itself (Scorecard Signed-Releases) and verifiable offline
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          zip="Build/dist/${EXTENSION_KEY}_${VERSION}.zip"
          cp "$PROVENANCE_BUNDLE" "$zip.provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "$zip.sbom.sigstore.json"
          gh release upload "$TAG" "$zip" "$zip".*.sigstore.json Build/dist/*.cdx.json --clobber

      - name: Hash archive
        id: hash
        run: |
          cd Build/dist
          echo "hashes=$(sha256sum "${EXTENSION_KEY}_${VERSION}.zip" | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: [build]
    permissions:
      # read workflow info
      actions: read
      # sign the provenance via Sigstore
      id-token: write
      # attach the provenance to the release
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ github.event.release.tag_name }}

  ter:
    name: Publish to TER
    needs: [build, provenance]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # holds the TYPO3_API_TOKEN secret; add required reviewers there to gate TER uploads
    environment: ter
    env:
      TAG: ${{ github.event.release.tag_name }}
      HASHES: ${{ needs.build.outputs.hashes }}
    steps:
      - name: Download attested archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${EXTENSION_KEY}_*.zip"
          echo "$HASHES" | base64 -d | sha256sum --check --strict

      - name: Upload to TER
        env:
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          version="${TAG#v}"
          zip="${EXTENSION_KEY}_${version}.zip"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $TYPO3_API_TOKEN" \
            -F "description=Release notes: $RELEASE_URL" \
            -F "gplCompliant=1" \
            -F "sha256=$(sha256sum "$zip" | cut -d' ' -f1)" \
            -F "sha512=$(sha512sum "$zip" | cut -d' ' -f1)" \
            -F "file=@$zip;type=application/zip" \
            "https://extensions.typo3.org/api/v1/extension/${EXTENSION_KEY}/${version}"
