name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  assets:
    name: Build, SBOM & attest
    runs-on: ubuntu-latest
    permissions:
      # upload release assets
      contents: write
      # sign attestations via Sigstore
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Resolve version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build TER archive
        run: Build/Scripts/create-ter-archive.sh "$TAG"

      # the SBOM describes the runtime dependency set resolved in composer.lock
      # for this release; dev tooling is omitted
      - name: Generate SBOM (CycloneDX)
        run: |
          composer global config --no-interaction allow-plugins.cyclonedx/cyclonedx-php-composer true
          composer global require --no-interaction --no-progress cyclonedx/cyclonedx-php-composer:6.2.0
          composer CycloneDX:make-sbom --omit=dev --output-format=JSON --spec-version=1.6 \
            --validate --mc-version="$VERSION" \
            --output-file="Build/dist/fourallportal_typo3_extension_${VERSION}.cdx.json"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: Build/dist/*.zip

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: Build/dist/*.zip
          sbom-path: Build/dist/fourallportal_typo3_extension_${{ env.VERSION }}.cdx.json

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" Build/dist/*.zip Build/dist/*.cdx.json --clobber
