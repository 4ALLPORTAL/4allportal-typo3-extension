name: Scorecard

on:
  push:
    branches: [main]
  # re-evaluate the Branch-Protection check whenever the rules change
  branch_protection_rule:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # upload results to code scanning
      security-events: write
      # publish results to the public Scorecard API (needed for the badge)
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # .github/ is export-ignored, so the default archive mode would not see
          # any workflow and skip the workflow-based checks
          file_mode: git

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
